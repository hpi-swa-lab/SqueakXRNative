  create-release-libraries:
    # needs: last-commit-check
    # if: ${{ needs.last-commit-check.outputs.has-new-commits == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest]
        # os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Install GLFW dependencies
        run: sudo apt update && sudo apt install -y libwayland-dev libxkbcommon-dev xorg-dev
      - name: Build and install GLFW 3.4
        run: |
          git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git
          cmake -S glfw -B glfw-build -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
          sudo cmake --build glfw-build --target install
      - run: mkdir build
      - uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build/
          source-dir: android/app/src/main/cpp/
          options: |
            ENABLE_RLOPENXR=OFF
            ENABLE_ANDROID=OFF
      - run: ls -lisa
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ env.RELEASE_TIME }}-dev-release
          files: "build/*.so"
          working_directory: scripts
