name: create-release
on: workflow_dispatch
# on:
#   schedule:
#     - cron: "15 0 * * *"
#       timezone: "Europe/Berlin"
env:
  RELEASE_TIME: REPLACE-THIS
jobs:
  last-commit-check:
    runs-on: ubuntu-latest
    outputs:
      has-new-commits: ${{ steps.script.outputs.has-new-commits }}
      release-date: ${{ steps.script.outputs.release-date }}
    steps:
      - uses: actions/checkout@v6
        with:
          # Fetches only one commit
          fetch-depth: 1
      - name: check last commit date
        id: script
        # check if last commit is newer than 24h
        run: |
          value=$(if [[ $(( $(date +%s) - 86400 )) -lt $(git log -1 --format="%ct") ]]; then echo true; else echo false; fi)
          echo "::set-output name=has-new-commits::$value"
          echo "::set-output name=release-date::$(date +%Y-%m-%d)"
          echo ""
          if [ "$value" = "true" ]; then 
            echo "Recent commits found. Continuing build..."; 
          else 
            echo "No recent commits. Skipping build...";
          fi
  create-release-image:
    needs: last-commit-check
    if: ${{ needs.last-commit-check.outputs.has-new-commits == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - run: sudo apt update && sudo apt install -y glslang-tools spirv-cross
      - run: (cd scripts && ./createRelease.sh)
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.last-commit-check.outputs.release-date }}-dev-release
          files: "*-SqueakXR-releaseImage.tar.gz"
          working_directory: scripts
  create-release-libraries:
    needs: last-commit-check
    if: ${{ needs.last-commit-check.outputs.has-new-commits == 'true' }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
      - name: Build and install GLFW 3.4
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt update && sudo apt install -y libwayland-dev libxkbcommon-dev xorg-dev
            git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git
            cmake -S glfw -B glfw-build -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF
            sudo cmake --build glfw-build --target install
          elif [ "$RUNNER_OS" == "Windows" ]; then
            git clone --depth 1 --branch 3.4 https://github.com/glfw/glfw.git
            cmake -S glfw -B glfw-build -DGLFW_BUILD_EXAMPLES=OFF -DGLFW_BUILD_TESTS=OFF -DGLFW_BUILD_DOCS=OFF -DCMAKE_INSTALL_PREFIX="$RUNNER_TEMP/glfw-install"
            cmake --build glfw-build --target install --config Release
            echo "CMAKE_PREFIX_PATH=$RUNNER_TEMP/glfw-install" >> "$GITHUB_ENV"
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install glfw
          else
            echo "$RUNNER_OS not supported"
            exit 1
          fi
        shell: bash
      - run: mkdir build
      - uses: threeal/cmake-action@v2.1.0
        with:
          build-dir: build/
          source-dir: android/app/src/main/cpp/
          options: |
            ENABLE_RLOPENXR=OFF
            ENABLE_ANDROID=OFF
            CMAKE_RUNTIME_OUTPUT_DIRECTORY=build
      - run: ls build
      - uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ needs.last-commit-check.outputs.release-date }}-dev-release
          files: |
            *.dll
            *.so
            *.dylib
          working_directory: build
